<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | BOLUXE</title>
<link rel="stylesheet" href="authstyles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>

<div class="forgotpassword">
    <div class="auth-logo">
        <img src="logo.png" alt="BOLUXE Logo">
    </div>

    <h1>Forgot Password</h1>
    <p>Enter your email below to receive a reset code.</p>

    <form action="enterresetcode.html">

       <label id="field-label"></label>
        <input type="email" placeholder="Enter email" required>

        <button type="submit">Reset Password</button>
    </form>

    <p>
        <a href="login.html">
            <i class="fa-solid fa-arrow-left"></i> Back to Login
        </a>
    </p>
</div>
</body>
</html>
