<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <div class="signup">
        <h1>Create An Account</h1>
        <form action="appointment.html">
            <label>Full Name:</label><br>
            <input type="text" placeholder="Enter your Fullname" required><br><br>

            <label>Email Address:</label><br>
            <input type="email" placeholder="Enter Email" required><br><br>

            <label>Password:</label><br>
            <input type="password" placeholder="Enter your Password" required><br><br>

            <label>
            <input type="checkbox">Remember Me<br><br>
        </label>
            <button type="submit">Create An Account</button><br><br>
            <p>By creating an account, you are<br>agreeing to the Terms of Service<br>and Privacy Policy.</p>
    </form>
        <p>Already have an account?
        <a href="login.html">Login</a></p>
    </div>
</body>
</html>
