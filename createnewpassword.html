<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | BOLUXE</title>
<link href="authstyles.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>

<div class="new-password">
    <div class="auth-logo">
        <img src="logo.png" alt="BOLUXE Logo">
    </div>

    <h1>Reset Password</h1>
    <p>Enter your new password below.</p>
    <form>

        <label id="field-label">New Password</label>
        <input type="password" id="new-password" placeholder="Enter new password" required>

        <label id="field-label">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Confirm password" required>

        <a href="login.html" class="reset-btn">Reset Password</a>
    </form>
</div>
</body>
</html>
