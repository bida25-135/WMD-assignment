<html>
<head>

<body>
<header>

    <h1>Let's get you Dolled Up!</h1>
    <p>Fill out the form below to book your appointment.</p>
</header>
<form>
    <!--Full Name-->
    <label>Full Name:</label><br>
    <input type="text"required><br>

    <!--Email-->
    <label>Email Address:</label><br>
    <input type="email"required><br>

    <!--Service-->
    <label>Select a Service:</label><br>
    <select required>
        <option>Choose a service</option><br>
        <option>Braiding</option><br>
        <option>Wig Installation</option><br>
        <option>Haircuts</option><br>
        <option>Hair Treatment</option><br>
    </select><br>

    <!-- Stylist -->
    <label for="stylist">Preferred Stylist:</label><br>
    <select required>
        <option>Select stylist</option>
        <option>Botsile</option>
        <option>Bugalo</option>
        <option>Nina</option>
        <option>Gomolemo</option>
        <option>Joe</option>
        <option>Brandon</option>
    </select><br>

    <!-- Appointment Date -->
    <label>Appointment Date:</label><br>
    <input type="date"required><br>

    <!-- Appointment Time -->
    <label>Appointment Time:</label><br>
    <input type="time"required><br>

    <!-- Submit -->
    <button type="submit">Submit</button>
</form>
<footer> 
    <p>&copy; BOLUXE</p> 
</footer>
</body>
</html>
