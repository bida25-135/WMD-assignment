<!DOCTYPE html>
<html>
<head>

<body>
<header>

    <h1>Let's get you Dolled Up!</h1>
    <h2>Your chair awaits.</h2>
    <p>Fill out the form below to book your appointment.</p>
</header>
<form>
    <!-- Name -->
    <label for="name">Full Name:</label><br>
    <input type="text"required><br>

    <!-- Email -->
    <label for="email">Email Address:</label><br>
    <input type="email"required><br>

    <!-- Service -->
    <label for="service">Select a Service:</label><br>
    <select required>
        <option value="">-- Choose a service --</option>
        <option value="braiding">Braiding</option>
        <option value="haircut">Wig Installation</option>
        <option value="styling">Haircuts</option>
        <option value="treatment">Hair Treatment</option>
    </select><br>

    <!-- Stylist -->
    <label for="stylist">Preferred Stylist:</label><br>
    <select required>
        <option value="">-- Select stylist --</option>
        <option value="Botsile">Botsile</option>
        <option value="Bugalo">Bugalo</option>
        <option value="Nina">Nina</option>
        <option value="Gomolemo">Gomolemo</option>
        <option value="Joe">Joe</option>
        <option value="Brandon">Brandon</option>
    </select><br>

    <!-- Date -->
    <label for="date">Appointment Date:</label><br>
    <input type="date"required><br>

    <!-- Time -->
    <label for="time">Appointment Time:</label><br>
    <input type="time"required><br>

    <!-- Submit -->
    <button type="submit">Submit</button>
</form>
<footer> 
    <p>&copy; BOLUXE</p> 
</footer>

</body>
</html>
