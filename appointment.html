!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
<header>
    <h1>Book Your Appointment</h1>
    <p>Complete the form below to book your appointment.</p>
</header>
<form>
    <!-- Name -->
    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name"required><br>

    <!-- Email -->
    <label for="email">Email Address:</label><br>
    <input type="email" id="email" name="email"required><br>

    <!-- Service -->
    <label for="service">Select a Service:</label><br>
    <select id="service" name="service" required>
        <option value="">-- Choose a service --</option>
        <option value="braiding">Braiding</option>
        <option value="haircut">Wig Installation</option>
        <option value="styling">Haircuts</option>
        <option value="treatment">Hair Treatment</option>
    </select><br>

    <!-- Stylist -->
    <label for="stylist">Preferred Stylist:</label><br>
    <select id="stylist" name="stylist">
        <option value="">-- Select stylist --</option>
        <option value="jane">Jane</option>
        <option value="lisa">Lisa</option>
        <option value="anna">Anna</option>
    </select><br>

    <!-- Date -->
    <label for="date">Appointment Date:</label><br>
    <input type="date" id="date" name="date" required><br>

    <!-- Time -->
    <label for="time">Appointment Time:</label><br>
    <input type="time" id="time" name="time" required><br>

    <!-- Submit -->
    <button type="submit" class="btn">Book Appointment</button>
</form>
</section>

<footer> 
    <p>&copy; BOLUXE</p> 
</footer>

</body>
</html>
