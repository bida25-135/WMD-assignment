<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <div class="login">
        <h1>Login</h1>
        <h3>Enter your login credentials</h3>
        <form action="appointment.html">
            <label>Email:</label><br>
            <input type="email" placeholder="Enter your Email" required><br><br>

            <label>Password:</label><br>
            <input type="password" placeholder="Enter your Password" required><br><br>
            <a href="forgotpassword.html">Forgot Password</a><br><br>
            
            <button type="submit">Login</button><br><br>

        <label>
            <input type="checkbox">Remember Me<br>
        </label>
    </form>
        <p>Don't have an account?
        <a href="signup.html">Create an account</a></p>
    </div>
</body>
</html>
